[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbastats"
version = "0.1.0"
description = "Base de dados e site privado de estatísticas da NBA"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.50"]
nbaapi = ["nba_api>=1.10"]
dev = ["pytest>=8.0"]

[project.scripts]
nbastats = "nbastats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nbastats = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
