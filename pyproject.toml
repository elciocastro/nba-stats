[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nbastats"
version = "0.1.0"
description = "Base de dados e site privado de estatísticas da NBA"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.50"]
nbaapi = ["nba_api>=1.10"]
injury = ["pdfplumber>=0.11"]
ia = ["anthropic"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
nbastats = "nbastats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nbastats = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["contrato: chama as APIs reais da NBA (NBASTATS_CONTRATO=1)"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: Depends(...) do FastAPI no padrão do parâmetro é o uso documentado
# B904/B905: estilo (raise from / zip strict) sem ganho aqui
ignore = ["B008", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "E741"]
