# Registro de apostas (metrics/apostas.py).

# Valor de 1 unidade, só para mostrar o lucro em dinheiro além de unidades
valor_unidade: 10.0
moeda: "R$"

# Unidades oferecidas no registro (protocolo: 0,5 especulativa, 1 padrão, 2 máxima)
unidades: [0.5, 1.0, 2.0]

# Jogador que não entrou em quadra: aposta anulada (devolve), como na maioria das casas
anular_se_nao_jogou: true

# Diário: motivos/etiquetas oferecidos ao registrar (dá para escrever outros)
etiquetas:
  - Matchup (DvP)
  - Desfalque no time
  - Minutos subindo
  - Ritmo do jogo
  - Linha atrasada
  - H2H
  - Forma recente
  - Palpite

# Jogo responsável: o site avisa (e pede confirmação) ao passar destes limites.
# Por usuário quando há login; sem login, valem para todas as apostas.
jogo_responsavel:
  limite_unidades_dia: 5
  limite_unidades_semana: 15
  aviso_sequencia_perdas: 4   # derrotas seguidas

# Página Valor (metrics/valor.py): edge = nossa chance − chance implícita (1/odd).
# Entra quem passa do edge mínimo (0,03 = 3 pontos percentuais). Valor não é
# certeza de acerto: é preço melhor que a chance.
valor:
  edge_minimo: 0.03
  top: 40
